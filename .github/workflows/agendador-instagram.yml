name: Agendador Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      so_teste:
        description: "Só testar a conexão (não publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agendador-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publicar posts no horário
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SO_TESTE: ${{ inputs.so_teste && '1' || '0' }}
        run: python agendador-instagram/publicar.py
      - name: Salvar o que foi publicado
        if: always()
        run: |
          git config user.name "agendador-instagram"
          git config user.email "agendador@users.noreply.github.com"
          git add agendador-instagram/publicados.json || true
          git diff --cached --quiet || (git commit -m "Agendador: registra posts publicados" && git push)
