name: Agendador Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "agendador-instagram/posts.json"
      - "agendador-instagram/publicar.py"
      - ".github/workflows/agendador-instagram.yml"
  workflow_dispatch:
    inputs:
      so_teste:
        description: "Só testar a conexão (não publica)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: agendador-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publicar posts no horário (fica de plantão até o próximo)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SO_TESTE: ${{ inputs.so_teste && '1' || '0' }}
        run: |
          git config user.name "agendador-instagram"
          git config user.email "agendador@users.noreply.github.com"
          python agendador-instagram/publicar.py
      - name: Passar o plantão para a próxima execução
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/agendador_continuar ]; then
            gh workflow run agendador-instagram.yml --ref main
            echo "Próxima execução disparada (próximo post: $(cat /tmp/agendador_continuar))."
          fi
