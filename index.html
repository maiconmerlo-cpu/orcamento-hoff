<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Or&ccedil;amento &mdash; Grupo Hoff</title>
<style>
:root{--azul:#1E5C99;--azul-claro:#4A9BE8;--tinta:#0F1B28;--linha:#D4DDE6;--fundo:#F2F5F8;--suave:#6B7C8D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--tinta);padding:0 0 120px;font-size:16px}
header{background:var(--tinta);color:#fff;padding:20px 18px}
header b{font-size:20px;font-weight:700;letter-spacing:.5px}
header span{display:block;font-size:13px;color:#8CA3B8;margin-top:3px}
main{max-width:640px;margin:0 auto;padding:18px}
fieldset{border:none;background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;border:1px solid var(--linha)}
legend{font-size:13px;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:1px;padding:0 0 12px}
label{display:block;font-size:13px;color:var(--suave);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--linha);border-radius:8px;background:#fff;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul-claro);box-shadow:0 0 0 3px rgba(74,155,232,.15)}
.item{border:1px solid var(--linha);border-radius:10px;padding:14px;margin-bottom:12px;background:#FAFCFE;position:relative}
.item h4{font-size:12px;color:var(--azul);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.remover{position:absolute;top:10px;right:10px;background:none;border:none;color:#B33;font-size:22px;width:32px;height:32px;cursor:pointer;padding:0}
.dupla{display:flex;gap:10px}
.dupla>div{flex:1}
.sub{text-align:right;font-size:15px;color:var(--suave);margin-top:10px}
.sub b{color:var(--tinta);font-size:18px}
.add{width:100%;padding:14px;background:#fff;border:2px dashed var(--azul-claro);color:var(--azul);border-radius:10px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.total{position:fixed;bottom:0;left:0;right:0;background:var(--tinta);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.total span{font-size:13px;color:#8CA3B8;display:block}
.total b{font-size:26px;font-weight:700}
.total button{background:var(--azul-claro);color:var(--tinta);border:none;border-radius:9px;padding:14px 20px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap}
.busca{position:relative}
.lista{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--linha);border-radius:8px;max-height:230px;overflow-y:auto;z-index:20;display:none;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.lista div{padding:11px 12px;font-size:14px;border-bottom:1px solid #EEF2F6;cursor:pointer;line-height:1.35}
.lista div:hover,.lista div.sel{background:#EBF4FD}
.lista small{display:block;color:var(--suave);font-size:11px;margin-top:2px}
@media print{
 header,.total,.add,.remover,.busca .lista{display:none}
 body{background:#fff;padding:0}
 fieldset{border:none;page-break-inside:avoid}
}
</style>
</head>
<body>
<header><b>OR&Ccedil;AMENTO</b><span>Grupo Hoff &middot; Pneus e servi&ccedil;os</span></header>
<main>
<fieldset>
<legend>Dados do cliente</legend>
<label for="nome">Nome do cliente</label>
<input id="nome" autocomplete="name" placeholder="Nome ou raz&atilde;o social">
<label for="cnpj">CNPJ</label>
<input id="cnpj" inputmode="numeric" placeholder="00.000.000/0000-00">
<label for="celular">Celular</label>
<input id="celular" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(51) 99999-9999">
<label for="endereco">Endere&ccedil;o</label>
<textarea id="endereco" rows="2" placeholder="Rua, n&uacute;mero, bairro"></textarea>
<div class="dupla">
  <div style="flex:2"><label for="cidade">Cidade</label>
  <input id="cidade" list="cidades" autocomplete="address-level2" placeholder="Cidade"></div>
  <div style="flex:1"><label for="uf">UF</label>
  <select id="uf"><option value="RS">RS</option><option value="SC">SC</option><option value="PR">PR</option><option value="">--</option></select></div>
</div>
<datalist id="cidades"></datalist>
</fieldset>

<fieldset>
<legend>Itens</legend>
<div id="itens"></div>
<button type="button" class="add" id="add">+ Adicionar item</button>
</fieldset>

<fieldset>
<legend>Observa&ccedil;&otilde;es</legend>
<textarea id="obs" rows="3" placeholder="Prazo de entrega, condi&ccedil;&otilde;es, validade..."></textarea>
<label for="vendedor">Vendedor</label>
<input id="vendedor" placeholder="Seu nome">
</fieldset>
</main>

<div id="pendentes" style="display:none;position:fixed;bottom:74px;left:0;right:0;background:#8A5A00;color:#fff;padding:10px 18px;font-size:13px;text-align:center;cursor:pointer;z-index:30"></div>
<div class="total">
  <div><span>Total do or&ccedil;amento</span><b id="total">R$ 0,00</b></div>
  <button type="button" id="gerar">Gerar or&ccedil;amento</button>
</div>

function brl(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function moeda(txt){
  var s = (txt||'').replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.');
  var v = parseFloat(s);
  return isNaN(v) ? 0 : v;
}

var box = document.getElementById('itens');
var seq = 0;

function novoItem(){
  seq++;
  var d = document.createElement('div');
  d.className='item';
  d.innerHTML =
   '<h4>Item '+seq+'</h4>'+
   '<button type="button" class="remover" title="Remover">&times;</button>'+
   '<label>Produto</label>'+
   '<div class="busca">'+
     '<input class="q" placeholder="Digite medida, marca ou modelo" autocomplete="off">'+
     '<div class="lista"></div>'+
   '</div>'+
   '<div class="dupla">'+
     '<div><label>Quantidade</label><input class="qt" type="number" min="1" step="1" value="1" inputmode="numeric"></div>'+
     '<div><label>Valor unit&aacute;rio</label><input class="vl" inputmode="decimal" placeholder="0,00"></div>'+
   '</div>'+
   '<div class="sub">Subtotal: <b class="st">R$ 0,00</b></div>';
  box.appendChild(d);
  ligar(d);
  recalcular();
}

function ligar(d){
  var q = d.querySelector('.q'), lista = d.querySelector('.lista');
  var qt = d.querySelector('.qt'), vl = d.querySelector('.vl');

  function fechar(){ lista.style.display='none'; }

  q.addEventListener('input', function(){
    var t = q.value.trim().toUpperCase();
    if(t.length < 2){ fechar(); return; }
    var termos = t.split(/\s+/);
    var achou = PRODUTOS.filter(function(p){
      var alvo = (p.descricao+' '+p.linha+' '+p.codigo).toUpperCase();
      return termos.every(function(x){ return alvo.indexOf(x) >= 0; });
    }).slice(0,40);
    if(!achou.length){ fechar(); return; }
    lista.innerHTML = achou.map(function(p){
      return '<div data-d="'+p.descricao.replace(/"/g,'&quot;')+'">'+p.descricao+
             '<small>'+p.linha+' &middot; c&oacute;d. '+p.codigo+'</small></div>';
    }).join('');
    lista.style.display='block';
    Array.prototype.forEach.call(lista.children, function(el){
      el.addEventListener('mousedown', function(ev){
        ev.preventDefault();
        q.value = el.getAttribute('data-d');
        fechar();
        vl.focus();
      });
    });
  });
  q.addEventListener('blur', function(){ setTimeout(fechar, 150); });

  vl.addEventListener('blur', function(){
    var v = moeda(vl.value);
    vl.value = v ? v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '';
    recalcular();
  });
  qt.addEventListener('input', recalcular);
  vl.addEventListener('input', recalcular);
  d.querySelector('.remover').addEventListener('click', function(){
    d.remove(); renumerar(); recalcular();
  });
}

function renumerar(){
  Array.prototype.forEach.call(box.children, function(d,i){
    d.querySelector('h4').textContent = 'Item '+(i+1);
  });
  seq = box.children.length;
}

function recalcular(){
  var total = 0;
  Array.prototype.forEach.call(box.children, function(d){
    var qt = parseFloat(d.querySelector('.qt').value)||0;
    var vl = moeda(d.querySelector('.vl').value);
    var st = qt*vl;
    total += st;
    d.querySelector('.st').textContent = brl(st);
  });
  document.getElementById('total').textContent = brl(total);
  return total;
}

function coletar(){
  var itens = [];
  Array.prototype.forEach.call(box.children, function(d){
    var desc = d.querySelector('.q').value.trim();
    var qt = parseFloat(d.querySelector('.qt').value)||0;
    var vl = moeda(d.querySelector('.vl').value);
    if(desc && qt) itens.push({descricao:desc, quantidade:qt, unitario:vl, subtotal:qt*vl});
  });
  return {
    nome: document.getElementById('nome').value.trim(),
    cnpj: document.getElementById('cnpj').value.trim(),
    celular: document.getElementById('celular').value.trim(),
    endereco: document.getElementById('endereco').value.trim(),
    cidade: document.getElementById('cidade').value.trim(),
    uf: document.getElementById('uf').value,
    vendedor: document.getElementById('vendedor').value.trim(),
    observacoes: document.getElementById('obs').value.trim(),
    itens: itens,
    total: itens.reduce(function(a,i){return a+i.subtotal;},0),
    data: new Date().toLocaleDateString('pt-BR')
  };
}

document.getElementById('add').addEventListener('click', novoItem);

var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyUjWvYVja3ccQL-AHFaZzXWOaPA_QDmMizH5N7kmYcU2ygdBG-IAYUmndRN6xzBneM/exec';

function enviarPlanilha(o){
  return fetch(ENDPOINT, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(o)
  });
}

function guardarPendente(o){
  var f=[];
  try{ f=JSON.parse(localStorage.getItem('hoff_pendentes')||'[]'); }catch(e){}
  f.push(o);
  try{ localStorage.setItem('hoff_pendentes', JSON.stringify(f)); }catch(e){}
  atualizarAviso();
}

function atualizarAviso(){
  var f=[];
  try{ f=JSON.parse(localStorage.getItem('hoff_pendentes')||'[]'); }catch(e){}
  var el=document.getElementById('pendentes');
  if(f.length){
    el.style.display='block';
    el.textContent = f.length+' or\u00e7amento(s) aguardando envio \u2014 toque para reenviar';
  } else { el.style.display='none'; }
}

function reenviarPendentes(){
  var f=[];
  try{ f=JSON.parse(localStorage.getItem('hoff_pendentes')||'[]'); }catch(e){}
  if(!f.length) return;
  var fila = Promise.resolve();
  f.forEach(function(o){ fila = fila.then(function(){ return enviarPlanilha(o); }); });
  fila.then(function(){
    localStorage.removeItem('hoff_pendentes');
    atualizarAviso();
    alert('Or\u00e7amentos pendentes enviados.');
  }).catch(function(){
    alert('Ainda sem conex\u00e3o. Os or\u00e7amentos continuam guardados.');
  });
}

document.getElementById('pendentes').addEventListener('click', reenviarPendentes);
atualizarAviso();
window.addEventListener('online', reenviarPendentes);

document.getElementById('gerar').addEventListener('click', function(){
  var o = coletar();
  if(!o.nome){ alert('Preencha o nome do cliente.'); return; }
  if(!o.itens.length){ alert('Adicione pelo menos um item.'); return; }

  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  enviarPlanilha(o).then(function(){
    btn.textContent = 'Gerar or\u00e7amento';
    btn.disabled = false;
  }).catch(function(){
    guardarPendente(o);
    btn.textContent = 'Gerar or\u00e7amento';
    btn.disabled = false;
  });
  var linhas = o.itens.map(function(i,n){
    return (n+1)+'. '+i.descricao+'\n   '+i.quantidade+' un x '+brl(i.unitario)+' = '+brl(i.subtotal);
  }).join('\n');
  var txt = 'ORCAMENTO - GRUPO HOFF\n'+o.data+'\n\n'+
    'Cliente: '+o.nome+'\n'+
    (o.cnpj?'CNPJ: '+o.cnpj+'\n':'')+
    (o.celular?'Celular: '+o.celular+'\n':'')+
    (o.endereco?'Endereco: '+o.endereco+'\n':'')+
    (o.cidade?'Cidade: '+o.cidade+(o.uf?'/'+o.uf:'')+'\n':'')+
    '\nITENS\n'+linhas+
    '\n\nTOTAL: '+brl(o.total)+
    (o.observacoes?'\n\nObs: '+o.observacoes:'')+
    (o.vendedor?'\n\nVendedor: '+o.vendedor:'')+
    '\n\nValores sujeitos a disponibilidade de estoque.';
  if(navigator.share){
    navigator.share({title:'Orcamento Grupo Hoff', text:txt}).catch(function(){});
  } else {
    navigator.clipboard.writeText(txt).then(function(){
      alert('Orcamento copiado. Cole no WhatsApp do cliente.');
    }, function(){
      prompt('Copie o orcamento:', txt);
    });
  }
});


var cnpjEl = document.getElementById('cnpj');
cnpjEl.addEventListener('input', function(){
  var v = cnpjEl.value.replace(/\D/g,'').slice(0,14);
  if(v.length > 12) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/,'$1.$2.$3/$4-$5');
  else if(v.length > 8) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4})/,'$1.$2.$3/$4');
  else if(v.length > 5) v = v.replace(/^(\d{2})(\d{3})(\d{0,3})/,'$1.$2.$3');
  else if(v.length > 2) v = v.replace(/^(\d{2})(\d{0,3})/,'$1.$2');
  cnpjEl.value = v;
});

var celEl = document.getElementById('celular');
celEl.addEventListener('input', function(){
  var v = celEl.value.replace(/\D/g,'').slice(0,11);
  if(v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');
  else if(v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3');
  else if(v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/,'($1) $2');
  celEl.value = v;
});

var cidEl = document.getElementById('cidade');
var dl = document.getElementById('cidades');
function carregarCidades(){
  var g = [];
  try { g = JSON.parse(localStorage.getItem('hoff_cidades')||'[]'); } catch(e){}
  dl.innerHTML = g.map(function(c){ return '<option value="'+c+'">'; }).join('');
}
function guardarCidade(c){
  if(!c) return;
  var g = [];
  try { g = JSON.parse(localStorage.getItem('hoff_cidades')||'[]'); } catch(e){}
  c = c.trim();
  if(g.indexOf(c) < 0){ g.push(c); g.sort(); }
  try { localStorage.setItem('hoff_cidades', JSON.stringify(g)); } catch(e){}
  carregarCidades();
}
cidEl.addEventListener('blur', function(){ guardarCidade(cidEl.value); });
carregarCidades();

novoItem();
